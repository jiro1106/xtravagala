<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login Page — Full Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f0f0ed; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

  .page {
    width: 100%;
    max-width: 1000px;
    height: 620px;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 24px 80px -12px rgba(0,0,0,0.18);
  }

  /* ── LEFT PANEL ── */
  .left {
    flex: 1.1;
    background: oklch(55% 0.09 170);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0 32px 40px;
  }

  /* Blob accents */
  .blob { position: absolute; border-radius: 50%; }
  .blob-1 { width: 300px; height: 300px; top: -80px; right: -80px; background: rgba(255,255,255,0.06); }
  .blob-2 { width: 200px; height: 200px; bottom: -60px; left: -60px; background: rgba(255,255,255,0.05); }
  .blob-3 { width: 120px; height: 120px; top: 40%; left: -40px; background: rgba(255,255,255,0.04); }

  /* Dot grid */
  .dot-grid {
    position: absolute;
    top: 24px; right: 24px;
    display: grid;
    grid-template-columns: repeat(5, 6px);
    gap: 8px;
    opacity: 0.18;
  }
  .dot-grid span { width: 6px; height: 6px; border-radius: 50%; background: white; display: block; }

  /* SVG illustration */
  .illustration { position: relative; z-index: 1; width: 100%; display: flex; justify-content: center; margin-bottom: 24px; }

  /* Tagline */
  .tagline { position: relative; z-index: 1; text-align: center; }
  .tagline h2 {
    font-size: 22px; font-weight: 600; color: white;
    letter-spacing: -0.025em; line-height: 1.3;
  }
  .tagline p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 6px; }

  /* ── RIGHT PANEL ── */
  .right {
    flex: 1;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    padding: 36px 44px;
    position: relative;
  }

  /* Back / logo */
  .back-logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; color: #2a2e30;
    font-size: 14px; font-weight: 600; letter-spacing: -0.015em;
    margin-bottom: auto;
  }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: oklch(55% 0.09 170);
    color: white; font-size: 13px; font-weight: 700;
    display: grid; place-items: center;
    box-shadow: 0 2px 8px -2px oklch(55% 0.09 170 / 0.5);
  }

  /* Form area */
  .form-area { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .form-title { font-size: 24px; font-weight: 600; color: #2a2e30; letter-spacing: -0.025em; margin-bottom: 4px; }
  .form-sub { font-size: 13.5px; color: #6a6f72; margin-bottom: 28px; }

  /* Google button */
  .google-btn {
    width: 100%; height: 44px; border-radius: 10px;
    border: 1.5px solid #e9e9e6; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 14px; font-weight: 500; color: #2a2e30;
    cursor: pointer; margin-bottom: 20px;
  }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .divider-line { flex: 1; height: 1px; background: #e9e9e6; }
  .divider span { font-size: 12px; color: #aaa; }

  /* Input */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: #6a6f72; margin-bottom: 5px; letter-spacing: 0.01em; }
  .field input {
    width: 100%; height: 42px; border-radius: 9px;
    border: 1.5px solid #e9e9e6; background: #fbfbfa;
    padding: 0 14px; font-size: 14px; color: #2a2e30;
    font-family: inherit; outline: none;
  }
  .field input:focus { border-color: oklch(55% 0.09 170); background: #fff; }

  /* Forgot row */
  .forgot-row {
    display: flex; justify-content: flex-end;
    margin-top: -4px; margin-bottom: 20px;
  }
  .forgot-row a { font-size: 12.5px; color: oklch(55% 0.09 170); text-decoration: none; }

  /* Submit button */
  .submit-btn {
    width: 100%; height: 44px; border-radius: 10px;
    background: oklch(55% 0.09 170); color: white; border: none;
    font-size: 14.5px; font-weight: 600; cursor: pointer;
    letter-spacing: -0.01em;
    box-shadow: 0 4px 16px -4px oklch(55% 0.09 170 / 0.5);
  }

  /* Signup link */
  .signup-link {
    text-align: center; font-size: 13px; color: #6a6f72; margin-top: 20px;
  }
  .signup-link a { color: oklch(55% 0.09 170); text-decoration: none; font-weight: 500; }

  /* Label at bottom */
  .preview-label {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: white; font-size: 12px;
    padding: 6px 14px; border-radius: 20px; font-family: sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="page">

  <!-- ── LEFT: Illustration Panel ── -->
  <div class="left">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="dot-grid">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="illustration">
      <svg width="300" height="280" viewBox="0 0 300 280" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ── Event card / calendar ── -->
        <rect x="70" y="60" width="100" height="112" rx="14" fill="white" fill-opacity="0.18"/>
        <rect x="70" y="60" width="100" height="30" rx="14" fill="white" fill-opacity="0.28"/>
        <rect x="70" y="74" width="100" height="16" fill="white" fill-opacity="0.28"/>
        <!-- Calendar date dots -->
        <rect x="83" y="104" width="14" height="14" rx="4" fill="white" fill-opacity="0.45"/>
        <rect x="103" y="104" width="14" height="14" rx="4" fill="white" fill-opacity="0.3"/>
        <rect x="123" y="104" width="14" height="14" rx="4" fill="white" fill-opacity="0.45"/>
        <rect x="143" y="104" width="14" height="14" rx="4" fill="white" fill-opacity="0.2"/>
        <rect x="83" y="124" width="14" height="14" rx="4" fill="white" fill-opacity="0.3"/>
        <rect x="103" y="124" width="14" height="14" rx="4" fill="oklch(68% 0.11 170)" fill-opacity="0.7"/>
        <rect x="123" y="124" width="14" height="14" rx="4" fill="white" fill-opacity="0.3"/>
        <rect x="143" y="124" width="14" height="14" rx="4" fill="white" fill-opacity="0.45"/>
        <!-- Calendar header text placeholder -->
        <rect x="82" y="68" width="30" height="6" rx="3" fill="white" fill-opacity="0.5"/>
        <rect x="118" y="68" width="20" height="6" rx="3" fill="white" fill-opacity="0.3"/>

        <!-- ── Ticket floating top right ── -->
        <g transform="rotate(-10 200 80)">
          <rect x="172" y="52" width="76" height="40" rx="9" fill="white" fill-opacity="0.2"/>
          <circle cx="179" cy="72" r="6" fill="white" fill-opacity="0.4"/>
          <rect x="190" y="65" width="46" height="6" rx="3" fill="white" fill-opacity="0.4"/>
          <rect x="190" y="75" width="32" height="4" rx="2" fill="white" fill-opacity="0.25"/>
          <!-- perforation -->
          <line x1="246" y1="52" x2="246" y2="92" stroke="white" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="3 3"/>
        </g>

        <!-- ── Person A (left) — joining ── -->
        <!-- Head -->
        <circle cx="94" cy="196" r="14" fill="white" fill-opacity="0.28"/>
        <!-- Body -->
        <path d="M72 238 Q94 218 116 238" stroke="white" stroke-opacity="0.28" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- Arm reaching right -->
        <path d="M110 220 Q126 214 138 218" stroke="white" stroke-opacity="0.35" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- ── Person B (right) — joining ── -->
        <!-- Head -->
        <circle cx="196" cy="192" r="14" fill="white" fill-opacity="0.28"/>
        <!-- Body -->
        <path d="M174 234 Q196 214 218 234" stroke="white" stroke-opacity="0.28" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- Arm reaching left -->
        <path d="M180 214 Q162 210 152 216" stroke="white" stroke-opacity="0.35" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- ── Handshake / connection point ── -->
        <circle cx="145" cy="216" r="10" fill="white" fill-opacity="0.22"/>
        <path d="M139 216 L151 216 M145 210 L145 222" stroke="white" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

        <!-- ── Small accent: map pin ── -->
        <g transform="translate(224, 136)">
          <circle cx="0" cy="-4" r="9" fill="white" fill-opacity="0.22"/>
          <circle cx="0" cy="-4" r="4" fill="white" fill-opacity="0.4"/>
          <path d="M0 5 L0 14" stroke="white" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- ── Floating star/sparkle accents ── -->
        <circle cx="58" cy="148" r="4" fill="white" fill-opacity="0.25"/>
        <circle cx="248" cy="162" r="3" fill="white" fill-opacity="0.2"/>
        <circle cx="42" cy="88" r="5" fill="white" fill-opacity="0.15"/>
        <circle cx="262" cy="108" r="6" fill="white" fill-opacity="0.12"/>
        <!-- small cross/sparkle -->
        <path d="M230 52 L230 60 M226 56 L234 56" stroke="white" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M55 170 L55 176 M52 173 L58 173" stroke="white" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="tagline">
      <h2>Find events worth<br/>showing up for.</h2>
      <p>Across the Philippines</p>
    </div>
  </div>

  <!-- ── RIGHT: Form Panel ── -->
  <div class="right">

    <!-- Logo / back -->
    <a class="back-logo" href="#">
      <div class="logo-mark">X</div>
      XtravaGala
    </a>

    <div class="form-area">
      <div class="form-title">Welcome back</div>
      <div class="form-sub">Sign in to your account</div>

      <!-- Google -->
      <button class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span>or</span>
        <div class="divider-line"></div>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" value=""/>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" value=""/>
      </div>

      <div class="forgot-row">
        <a href="#">Forgot password?</a>
      </div>

      <button class="submit-btn">Sign in</button>

      <div class="signup-link">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </div>

  </div>
</div>

<div class="preview-label">Full mockup — click anywhere, then tell me your feedback in the terminal</div>

</body>
</html>
